## Bio Artist — Chico Loco 40

Samir Libari, professionally known as Chico Loco 40, is a Moroccan-American rapper, artist, producer, actor, publisher, and entrepreneurship form New York. He is the founder, COO, and CTO of CL40 World, a global music and creative business brand.

He is known for his work in music production, songwriting, performing, publishing ASCAP and rights human Amnesty International, digital media, and creative business development. His career includes artistic collaboration, media work, and international entrepreneurial projects.

Chico Loco 40 has built a global creative network through CL40 World, with partnerships and visibility across the United States, Morocco, Australia, China, Latin America, and Spain. His artistic style blends hip-hop, rap, alternative sounds, and cinematic production.

